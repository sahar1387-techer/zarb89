<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی ضرب ۸ و ۹ 🎮</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-box">
            <h1>🧮 بازی ضرب ۸ و ۹</h1>
            <p class="subtitle">طراحی و اجرا: سحر حق جو</p>
            
            <div class="score-board">
                <span>⭐ امتیاز: <span id="score">0</span></span>
                <span>📊 تعداد: <span id="total">0</span></span>
            </div>

            <div class="question-area">
                <p id="question" class="question">؟ × ؟ = ؟</p>
            </div>

            <div class="input-area">
                <input type="number" id="answer" placeholder="پاسخ را وارد کنید..." autofocus>
                <button id="submitBtn">✅ تایید</button>
            </div>

            <p id="result" class="result"></p>

            <div class="buttons">
                <button id="newGameBtn">🔄 بازی جدید</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
